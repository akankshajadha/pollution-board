<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Board</title>
    <!-- Clean Google Fonts direct request path -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=903">
</head>
<body>

    <div class="signboard-container">
        <div class="led-screen">
            <table class="board-table">
                <thead>
                    <tr>
                        <th colspan="3" class="main-header">CONSTRUCTION BOARD</th>
                    </tr>
                
                    <tr class="datetime-row">
                        <td colspan="1" class="date-cell">
                            Date: <span id="dateDisplay">--/--/--</span>
                        </td>
                        <td colspan="2" class="time-cell">
                            Time: <span id="timeDisplay">--:--</span>
                        </td>
                    </tr>
              
                    <tr class="column-headers">
                        <th class="col-param">Parameter</th>
                        <th class="col-count">Count</th>
                        <th class="col-unit">Unit</th>
                    </tr>
                </thead>

                <tbody>
                    <tr id="row-temp">
                        <td class="param-cell">TEMPERATURE</td>
                        <td class="conc-cell" id="tempDisplay">--.-</td>
                        <td class="unit-cell">°C</td>
                    </tr>
                    <tr id="row-humidity">
                        <td class="param-cell">HUMIDITY</td>
                        <td class="conc-cell" id="humDisplay">--</td>
                        <td class="unit-cell">%</td>
                    </tr>
                    <tr id="row-pm25">
                        <td class="param-cell">PM2.5</td>
                        <td class="conc-cell" id="pm25Display">--</td>
                        <td class="unit-cell unit-special">µg/m³</td>
                    </tr>
                    <tr id="row-pm10">
                        <td class="param-cell">PM10</td>
                        <td class="conc-cell" id="pm10Display">--</td>
                        <td class="unit-cell unit-special">µg/m³</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- PURE ES5 LEGACY JAVASCRIPT: GUARANTEED NOT TO CRASH TAURUS EMBEDDED PLAYER CORES -->
    <script>
        // Custom zero-padding mechanism replacing unsupported ES6 .padStart()
        function classicPadZero(num) {
            return num < 10 ? '0' + num : '' + num;
        }

        // 1. UNIVERSAL COMPATIBLE CLOCK LOGIC
        function updateLiveClock() {
            var now = new Date();
            var day = classicPadZero(now.getDate());
            var month = classicPadZero(now.getMonth() + 1); 
            var year = now.getFullYear();
            
            var hours = now.getHours();
            var minutes = classicPadZero(now.getMinutes());
            var ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // Converts '0' hour to '12'
            var formattedHours = classicPadZero(hours);
            
            var timeString = formattedHours + ':' + minutes + ' ' + ampm;
            
            var dateEl = document.getElementById("dateDisplay");
            var timeEl = document.getElementById("timeDisplay");
            
            if (dateEl) dateEl.innerText = day + '/' + month + '/' + year;
            if (timeEl) timeEl.innerText = timeString;
        }

        // 2. STABLE OFFLINE-FIRST TELEMETRY WRITER
        function displayTelemetryData() {
            // Instantly forces standard numbers onto the screen modules on load
            var tempEl = document.getElementById("tempDisplay");
            var humEl = document.getElementById("humDisplay");
            var pm25El = document.getElementById("pm25Display");
            var pm10El = document.getElementById("pm10Display");

            if (tempEl) tempEl.innerText = "26.4";
            if (humEl) humEl.innerText = "65";
            if (pm25El) pm25El.innerText = "36";
            if (pm10El) pm10El.innerText = "83";
        }

        // 3. SECURE HARDWARE RUNTIME ATTACHMENT
        function initializeSystem() {
            console.log("System initialization sequence engaged...");
            
            // Fire layout elements instantly to drop dashes immediately
            updateLiveClock();
            displayTelemetryData();
            
            // Continuous clock update interval loop (every 1 second)
            setInterval(updateLiveClock, 1000);
        }

        // Safe legacy trigger hook
        window.onload = initializeSystem;
    </script>
</body>
</html>
