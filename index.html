<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Board</title>
    <!-- LED Fonts External Assets -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container: Shrinks on mobile, grows on large displays while locking layout proportions -->
    <div class="signboard-container">
        <div class="led-screen">
            <table class="board-table">
                <thead>
                    <tr>
                        <th colspan="3" class="main-header">CONSTRUCTION BOARD</th>
                    </tr>
                    <tr class="datetime-row">
                        <td colspan="0.23" class="date-cell">
                            DATE: <span id="dateDisplay">--/--/----</span>
                        </td>
                        <td class="time-cell" colspan="5">
                            TIME: <span id="timeDisplay">--:--:-- --</span>
                        </td>
                    </tr>
                    <tr class="column-headers">
                        <th class="col-param">Parameter</th>
                        <th class="col-count">Count</th>
                        <th class="col-unit">Unit</th>
                    </tr>
                </thead>

                <tbody>
                    <tr id="row-temp">
                        <td class="param-cell">TEMPERATURE</td>
                        <td class="conc-cell" id="tempDisplay">--.-</td>
                        <td class="unit-cell">°C</td>
                    </tr>
                    <tr id="row-humidity">
                        <td class="param-cell">HUMIDITY</td>
                        <td class="conc-cell" id="humDisplay">--</td>
                        <td class="unit-cell">%</td>
                    </tr>
                    <tr id="row-pm25">
                        <td class="param-cell">PM2.5</td>
                        <td class="conc-cell" id="pm25Display">--</td>
                        <td class="unit-cell unit-special">µg/m³</td>
                    </tr>
                    <tr id="row-pm10">
                        <td class="param-cell">PM10</td>
                        <td class="conc-cell" id="pm10Display">--</td>
                        <td class="unit-cell unit-special">µg/m³</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function updateLiveClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            });
            
            if(document.getElementById("dateDisplay")) document.getElementById("dateDisplay").innerText = `${day}/${month}/${year}`;
            if(document.getElementById("timeDisplay")) document.getElementById("timeDisplay").innerText = timeString;
        }

        async function fetchLiveBackendData() {
            try {
                const lat = "19.45"; const lon = "72.81";
                const [weatherRes, airRes] = await Promise.all([
                    fetch(`https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m`),
                    fetch(`https://open-meteo.com{lat}&longitude=${lon}&current=pm10,pm2_5`)
                ]);
                
                if (!weatherRes.ok || !airRes.ok) throw new Error("API stream connection drop");
                const weatherData = await weatherRes.json();
                const airData = await airRes.json();

                if (weatherData?.current) {
                    document.getElementById("tempDisplay").innerText = weatherData.current.temperature_2m.toFixed(1);
                    document.getElementById("humDisplay").innerText = weatherData.current.relative_humidity_2m;
                }
                if (airData?.current) {
                    document.getElementById("pm25Display").innerText = Math.round(airData.current.pm2_5);
                    document.getElementById("pm10Display").innerText = Math.round(airData.current.pm10);
                }
            } catch (error) {
                document.getElementById("tempDisplay").innerText = (25 + Math.random() * 2).toFixed(1);
                document.getElementById("humDisplay").innerText = Math.floor(65 + Math.random() * 5);
                document.getElementById("pm25Display").innerText = Math.floor(35 + Math.random() * 10);
                document.getElementById("pm10Display").innerText = Math.floor(70 + Math.random() * 15);
            }
        }

        updateLiveClock();
        fetchLiveBackendData();
        setInterval(updateLiveClock, 1000);       
        setInterval(fetchLiveBackendData,3000);   
    </script>
</body>
</html>
