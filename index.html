    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Construction Board</title>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
<div class ="Parameter-title"> PARAMETER COUNT </div>
    
</div>
        <div class="signboard-container">
            <div class="led-screen">
                <table class="board-table">

                    <thead>
                        
                        <tr>
                            <th colspan="3" class="main-header">CONSTRUCTION BOARD</th>
                        </tr>
                    
                        <!-- <tr id="row-location">  -->
                            <!-- <td class="param-cell">LOCATION</td>   -->
                            <!-- <td class="conc-cell location-merged-cell" id="locationDisplay"colspan="3">GPS INIT...</td>  -->
                        <!-- </tr>  -->
                        <tr class="datetime-row">
                            <td colspan="1" class="date-cell">
                                DATE: <span id="dateDisplay">--/--/----</span>
                            </td>
                            <td class="time-cell" colspan="2">
                                TIME: <span id="timeDisplay">--:--:-- --</span>
                            </td>
                            
                    
                        </tr>
                        </tr>
                        <tr class="column-headers">
                            <th class="col-param">Parameter</th>
                            <th class="col-count">Count</th>
                            <th class="col-unit">Unit</th>
                        </tr>
                    </thead>

                    <tbody>
                
                        </tr>
                        <tr id="row-temp">
                            <td class="param-cell">TEMPERATURE</td>
                            <td class="conc-cell" id="tempDisplay">--.-</td>
                            <td class="unit-cell">°C</td>
                        </tr>
                        <tr id="row-humidity">
                            <td class="param-cell">HUMIDITY</td>
                            <td class="conc-cell" id="humDisplay">--</td>
                            <td class="unit-cell">%</td>
                        </tr>
                        <tr id="row-pm25">
                            <td class="param-cell">PM2.5</td>
                            <td class="conc-cell" id="pm25Display">--</td>
                            <td class="unit-cell unit-special">µg/m³</td>
                        </tr>
                        <tr id="row-pm10">
                            <td class="param-cell">PM10</td>
                            <td class="conc-cell" id="pm10Display">--</td>
                            <td class="unit-cell unit-special">µg/m³</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <script>
        
            let activeLat = "19.45";
            let activeLon = "72.81";

            function updateLiveClock() {
                const now = new Date();
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear();
                const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                
                if(document.getElementById("dateDisplay")) document.getElementById("dateDisplay").innerText = `${day}/${month}/${year}`;
                if(document.getElementById("timeDisplay")) document.getElementById("timeDisplay").innerText = timeString;
            }

        
        async function fetchCityName(lat, lon) {
        try {
            // OpenStreetMap reverse geocoding URL
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
            const res = await fetch(url);
            
            if (!res.ok) throw new Error("Location lookup failed");

            const data = await res.json();
            const address = data.address || {};
            
            // Pick the best location field available
            const city = address.city || address.town || address.village || address.suburb || address.county || "LOCAL";

            // Display the location in UPPERCASE on the LED board
            if (document.getElementById("locationDisplay")) {
                document.getElementById("locationDisplay").innerText = city.toUpperCase();
            }
        } catch (error) {
            console.error("Failed to map location name:", error);
            if (document.getElementById("locationDisplay")) {
                document.getElementById("locationDisplay").innerText = "CONNECTED";
            }
        }
    }
        
            async function fetchLiveBackendData() {
                try {
                    console.log(`📡 Requesting telemetry streams for: Lat ${activeLat}, Lon ${activeLon}`);

                
                    const [weatherRes, airRes] = await Promise.all([
                        fetch(`https://open-meteo.com{activeLat}&longitude=${activeLon}&current=temperature_2m,relative_humidity_2m`),
                        fetch(`https://open-meteo.com{activeLat}&longitude=${activeLon}&current=pm10,pm2_5`)
                    ]);

                    if (!weatherRes.ok || !airRes.ok) throw new Error("API stream connection dropped");
                    
                    const weatherData = await weatherRes.json();
                    const airData = await airRes.json();

                
                    if (weatherData?.current) {
                        document.getElementById("tempDisplay").innerText = weatherData.current.temperature_2m.toFixed(1);
                        document.getElementById("humDisplay").innerText = weatherData.current.relative_humidity_2m;
                    }
                    
                    if (airData?.current) {
                        document.getElementById("pm25Display").innerText = Math.round(airData.current.pm2_5);
                        document.getElementById("pm10Display").innerText = Math.round(airData.current.pm10);
                    }
                } catch (error) {
                    console.warn("API Error. Running simulation values:", error.message);
                    
                    
                    document.getElementById("tempDisplay").innerText = (25 + Math.random() * 2).toFixed(1);
                    document.getElementById("humDisplay").innerText = Math.floor(65 + Math.random() * 5);
                    document.getElementById("pm25Display").innerText = Math.floor(35 + Math.random() * 10);
                    document.getElementById("pm10Display").innerText = Math.floor(70 + Math.random() * 15);
                }   
            }

        
            function initializeLiveLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            activeLat = position.coords.latitude.toFixed(4);
                            activeLon = position.coords.longitude.toFixed(4);
                            
                            console.log("📍 GPS HARDWARE LINK ESTABLISHED:", activeLat, activeLon);
                            
                            fetchCityName(activeLat, activeLon);
                            fetchLiveBackendData();
                        },
                        (error) => {
                            console.warn("Hardware tracking blocked. Using defaults.");
                            fetchCityName(activeLat, activeLon);
                            fetchLiveBackendData();
                        }
                    );
                } else {
                    fetchCityName(activeLat, activeLon);
                    fetchLiveBackendData();
                }
            }
            updateLiveClock();
            initializeLiveLocation();

            setInterval(updateLiveClock, 1000);
            setInterval(fetchLiveBackendData, 3000);
        </script>
    </body>
    </html>
