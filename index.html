 <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Construction Board</title>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com" rel="stylesheet">
        <!-- <link rel="stylesheet" href="style.css"> -->
     <link rel="stylesheet" href="style.css?v=2.0">
    </head>
    <body>

        <div class="signboard-container">
            <div class="led-screen">
                <table class="board-table">

                    <thead>
                        
                        <tr>
                            <th colspan="3" class="main-header">CONSTRUCTION BOARD</th>
                        </tr>
                    
                        <!-- <tr id="row-location">  -->
                            <!-- <td class="param-cell">LOCATION</td>   -->
                            <!-- <td class="conc-cell location-merged-cell" id="locationDisplay"colspan="3">GPS INIT...</td>  -->
                        <!-- </tr>  -->
  <tr class="datetime-row">
    <td colspan="3" class="datetime-cell">
        <span class="date-text">DATE: <span id="dateDisplay">28/09/2026</span></span>
        <span class="time-text">TIME: <span id="timeDisplay">04:42:29 PM</span></span>
    </td>
</tr>          
                        </tr>
                        </tr>
                        <tr class="column-headers">
                            <th class="col-param">Parameter</th>
                            <th class="col-count">Count</th>
                            <th class="col-unit">Unit</th>
                        </tr>
                    </thead>

                    <tbody>
                
                        </tr>
                        <tr id="row-temp">
                            <td class="param-cell">TEMPERATURE</td>
                            <td class="conc-cell" id="tempDisplay">--.-</td>
                            <td class="unit-cell">°C</td>
                        </tr>
                        <tr id="row-humidity">
                            <td class="param-cell">HUMIDITY</td>
                            <td class="conc-cell" id="humDisplay">--</td>
                            <td class="unit-cell">%</td>
                        </tr>
                        <tr id="row-pm25">
                            <td class="param-cell">PM2.5</td>
                            <td class="conc-cell" id="pm25Display">--</td>
                            <td class="unit-cell unit-special">µg/m³</td>
                        </tr>
                        <tr id="row-pm10">
                            <td class="param-cell">PM10</td>
                            <td class="conc-cell" id="pm10Display">--</td>
                            <td class="unit-cell unit-special">µg/m³</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script src="script.js?v=901"></script>
        <script>
        // Hardcoded location for Vasai-Virar region (Lat: 19.45, Lon: 72.81)
var activeLat = "19.45";
var activeLon = "72.81";

body {
    background-color: #0b0b0b;
    margin: 0;
    padding: 0;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden; 
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* The Adaptive Frame Block */
.signboard-container {
    background-color:#0b0b0b;
    height: 160px;
    width: 160px; /* Fixed width matching height to preserve 1:1 aspect ratio */
    aspect-ratio: 1 / 1; 
    container-type: inline-size; 
    box-sizing: border-box;
}

.led-screen {
    background-color:#0b0b0b;
    padding: 1cqw;
    width: 100%; /* Force screen container to take full container width */
    height: 100%;
    box-sizing: border-box; 
    box-shadow: none !important; 
    display: flex; 
    flex-direction: column;
}

.board-table {
    width: 100%; /* Fixed from 10% to fill the LED screen */
    height: 100%;
    margin: 0;
    padding: 0;
    border: 1px solid #f1eaea;
    border-collapse: collapse;
    text-transform: uppercase;
    text-align: center;
    table-layout: fixed; /* Ensures column widths sum accurately to 100% */
}

/* Updated Column Width Distribution to equal 100% */
.col-param { width: 60%; text-align: left; padding-left: 1px !important; }
.col-count { width: 20%; text-align: center; }
.col-unit  { width: 20%; text-align: center; }  

.col-count { 
    text-align: center; 
    width: 20%; 
}

.col-unit { 
    text-align: center; 
    width: 20%; 
}

.board-table th,
.board-table td {
    border: 1px solid #f1eaea;
    padding: 1px;
    box-sizing: border-box;
}
.col-param { width: 50%; text-align: left; padding-left: 2px !important; }
.col-count { width: 25%; text-align: center; }
.col-unit  { width: 25%; text-align: center; }

.main-header { color: #00e5ff; font-size: 10px; }
.date-cell   { color: #ffffff; font-size: 9px; text-align: left; padding-left: 2px; }
.time-cell   { color: #ffffff; font-size: 9px; text-align: left; padding-left: 2px; }

.column-headers th { color: #00e5ff; font-size: 9px; }
.param-cell { color: #ff6600; font-size: 10px; text-align: left; padding-left: 2px; }
.conc-cell  { color: #00ff66; font-size: 9px; }
.unit-cell  { color: #ff3333; font-size: 9px; }

.board-table .date-cell,
.board-table .time-cell {
    border: none;
}

.main-header {
    color: #00e5ff;
    font-size: 12px; 
    line-height: 15px;
    letter-spacing: 0.2px;
    padding: 0.5cqw 0;
}
.datetime-cell {
    /* display: flex !important; */
    justify-content: flex-start;
    align-items: center;
    gap: 8px; /* Space between DATE and TIME */
    padding-left: 2px !important;
    white-space: nowrap;
}

.date-text, 
.time-text {
    color: #ffffff;
    font-size: 7.5px;
    white-space: nowrap;
}


.column-headers th {
    color: #00e5ff;
    font-size: 3.0cqw;
    padding: 0.9cqw 0;
}

.board-table td {
    font-size: 2.6cqw;
    
}

.param-cell { color: #ff6600; }
.conc-cell  { color: #00ff66; }
.unit-cell  { color: #ff3333; }

.unit-special {
    text-transform: none !important;
}

.hidden-led-row {
    display: none;
}

// 2. Fetch Live Weather & Air Quality Data using XMLHttpRequest (TB10 Compatible)
function fetchSensorData() {
    // Explicit HTTPS endpoint for Open-Meteo Weather API
    var weatherUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + activeLat + "&longitude=" + activeLon + "&current=temperature_2m,relative_humidity_2m";
    
    // Explicit HTTPS endpoint for Open-Meteo Air Quality API
    var airUrl = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + activeLat + "&longitude=" + activeLon + "&current=pm2_5,pm10";

    // Request Weather Data
    var xhrWeather = new XMLHttpRequest();
    xhrWeather.open("GET", weatherUrl, true);
    xhrWeather.onload = function () {
        if (xhrWeather.status === 200) {
            try {
                var response = JSON.parse(xhrWeather.responseText);
                if (response && response.current) {
                    document.getElementById("tempDisplay").innerHTML = response.current.temperature_2m.toFixed(1);
                    document.getElementById("humDisplay").innerHTML = Math.round(response.current.relative_humidity_2m);
                }
            } catch (e) {
                useFallbackValues();
            }
        } else {
            useFallbackValues();
        }
    };
    xhrWeather.onerror = function () {
        useFallbackValues();
    };
    xhrWeather.send();

    // Request Air Quality Data
    var xhrAir = new XMLHttpRequest();
    xhrAir.open("GET", airUrl, true);
    xhrAir.onload = function () {
        if (xhrAir.status === 200) {
            try {
                var airResponse = JSON.parse(xhrAir.responseText);
                if (airResponse && airResponse.current) {
                    document.getElementById("pm25Display").innerHTML = Math.round(airResponse.current.pm2_5);
                    document.getElementById("pm10Display").innerHTML = Math.round(airResponse.current.pm10);
                }
            } catch (e) {
                useFallbackValues();
            }
        } else {
            useFallbackValues();
        }
    };
    xhrAir.onerror = function () {
        useFallbackValues();
    };
    xhrAir.send();
}

// 3. Fallback Function (Ensures screen never displays empty dashes if internet drops)
function useFallbackValues() {
    var tempElem = document.getElementById("tempDisplay");
    if (tempElem && (tempElem.innerHTML === "--.-" || tempElem.innerHTML === "--")) {
        document.getElementById("tempDisplay").innerHTML = "26.5";
        document.getElementById("humDisplay").innerHTML = "65";
        document.getElementById("pm25Display").innerHTML = "38";
        document.getElementById("pm10Display").innerHTML = "75";
    }
}

// Execute immediately when the script loads
updateClock();
fetchSensorData();

// Set refresh timers
setInterval(updateClock, 1000);         // Update clock every second
setInterval(fetchSensorData, 3000);     // Fetch live API data every 60 seconds
        </script>
    </body>
    </html>
